</head>
<body>
<div class="container">
  <header>
    <h1>🎬 Video Breakdown</h1>
    <span class="sub">导演级分镜分析</span>
  </header>

  <div class="input-bar">
    <input type="url" id="urlInput" placeholder="粘贴抖音 / 小红书视频链接..." />
    <button class="btn-start" id="startBtn">🚀 开始分析</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-header">
      <span class="progress-step" id="stepText">排队中...</span>
      <span class="progress-pct" id="pctText">0%</span>
    </div>
    <progress id="progressBar" value="0" max="100"></progress>
  </div>

  <div class="script-section" id="scriptSection">
    <div class="script-header">
      <h2>📋 分镜脚本</h2>
      <button onclick="window.print()">🖨 打印</button>
    </div>
    <div id="shotsContainer"></div>
    <div class="script-narrative" id="narrativeSection">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin:0">🎬 导演叙事分析</h3>
        <button id="copyBtn" style="padding:6px 18px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s" onclick="copyScript()">
          📋 复制全文
        </button>
      </div>
      <div class="content" id="narrativeContent"></div>
    </div>
  </div>

  <div id="emptyState"><div class="empty-state">
    <div class="icon">🎥</div>
    <h3>输入视频链接，开始分析</h3>
    <p>AI导演级逐帧分析 · 微表情 · 光影运镜 · 完整分镜脚本</p>
  </div></div>
</div>

<script>
const el = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };

function renderShot(f, idx){
  const a = f.analysis || {};
  const fe = a.facial_expression || {};
  const md = fe.micro_details || {};
  const ca = a.character_action || {};
  const li = a.lighting || {};
  const col = a.color_analysis || {};
  const nar = a.narrative || {};
  const cin = a.cinematography || {};

  return `<div class="shot-row">
    <div class="shot-frame">
      <img src="${esc(f.frame_url)}" alt="镜头${idx}" loading="lazy" onclick="window.open(this.src)" />
      <div class="time-label">⏱ ${esc(f.time)}</div>
    </div>
    <div class="shot-text">
      <div class="shot-title">【镜头 ${idx}】${esc(a.shot_type||'')} · ${esc(a.camera_movement||'')}</div>
      <div class="shot-meta">
        <span class="meta-tag">🎯 ${esc(a.shot_type||'?')}</span>
        <span class="meta-tag">📹 ${esc(a.camera_movement||'?')}</span>
        <span class="meta-tag">🎨 ${esc(a.composition||'?')}</span>
        ${fe.primary_emotion ? `<span class="meta-tag emotion">😊 ${esc(fe.primary_emotion)}</span>` : ''}
        ${nar.tension != null ? `<span class="meta-tag">⚡ 张力${(nar.tension*100).toFixed(0)}%</span>` : ''}
      </div>
      <div class="detail-grid">
        ${cin.camera_height ? `<div class="detail-item"><span class="label">机位</span> ${esc(cin.camera_height)}</div>` : ''}
        ${cin.lens ? `<div class="detail-item"><span class="label">镜头</span> ${esc(cin.lens)}</div>` : ''}
        ${cin.focus ? `<div class="detail-item"><span class="label">对焦</span> ${esc(cin.focus)}</div>` : ''}
        ${li.atmosphere ? `<div class="detail-item"><span class="label">光影</span> ${esc(li.atmosphere)}</div>` : ''}
        ${li.key_light_direction ? `<div class="detail-item"><span class="label">主光</span> ${esc(li.key_light_direction)}</div>` : ''}
        ${col.dominant_color ? `<div class="detail-item"><span class="label">色调</span> ${esc(col.dominant_color)}</div>` : ''}
        ${col.color_grading ? `<div class="detail-item"><span class="label">调色</span> ${esc(col.color_grading)}</div>` : ''}
        ${nar.beat ? `<div class="detail-item"><span class="label">叙事</span> ${esc(nar.beat)}</div>` : ''}
      </div>
      <div class="detail-grid">
        ${ca.pose ? `<div class="detail-item"><span class="label">姿势</span> ${esc(ca.pose)}</div>` : ''}
        ${ca.movement ? `<div class="detail-item"><span class="label">运动</span> ${esc(ca.movement)}</div>` : ''}
        ${ca.gesture ? `<div class="detail-item"><span class="label">手势</span> ${esc(ca.gesture)}</div>` : ''}
        ${ca.body_language ? `<div class="detail-item"><span class="label">肢体</span> ${esc(ca.body_language)}</div>` : ''}
      </div>
      <div class="detail-grid">
        ${md.eyebrows ? `<div class="detail-item"><span class="label">眉</span> ${esc(md.eyebrows)}</div>` : ''}
        ${md.eyes ? `<div class="detail-item"><span class="label">眼</span> ${esc(md.eyes)}</div>` : ''}
        ${md.mouth ? `<div class="detail-item"><span class="label">嘴</span> ${esc(md.mouth)}</div>` : ''}
        ${fe.intensity != null ? `<div class="detail-item"><span class="label">情绪强度</span> ${(fe.intensity*100).toFixed(0)}%</div>` : ''}
      </div>
      ${fe.emotion_change ? `<div class="scene-text">🔄 ${esc(fe.emotion_change)}</div>` : ''}
      ${a.scene ? `<div class="scene-text">${esc(a.scene)}</div>` : ''}
      ${Array.isArray(a.keywords) && a.keywords.length ? `<div class="keywords">${a.keywords.map(k => `<span>#${esc(k)}</span>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

let currentTaskId = null;

async function poll(){
  if(!currentTaskId) return;
  const r = await fetch('/api/tasks/' + currentTaskId);
  const d = await r.json();
  el('stepText').textContent = d.step || '处理中...';
  el('pctText').textContent = (d.progress || 0) + '%';
  el('progressBar').value = d.progress || 0;

  if(Array.isArray(d.frames) && d.frames.length > 0){
    const container = el('shotsContainer');
    const existing = container.querySelectorAll('.shot-row').length;
    for(let i = existing; i < d.frames.length; i++){
      const tmp = document.createElement('div');
      tmp.innerHTML = renderShot(d.frames[i], i+1);
      const row = tmp.firstElementChild;
      if(row) container.appendChild(row);
    }
    el('scriptSection').classList.add('active');
    el('emptyState').style.display = 'none';
  }

  // 叙事文案（完成后显示）
  if(d.full_analysis && d.full_analysis.script){
    el('narrativeContent').textContent = d.full_analysis.script;
    el('narrativeSection').classList.add('active');
  }

  if(!d.done){
    setTimeout(poll, 1500);
  } else {
    el('stepText').textContent = '✅ 完成!';
    el('startBtn').disabled = false;
    el('urlInput').disabled = false;
  }
}

el('startBtn').onclick = async function(){
  const url = el('urlInput').value.trim();
  if(!url) return;
  this.disabled = true;
  el('urlInput').disabled = true;
  el('shotsContainer').innerHTML = '';
  el('narrativeSection').classList.remove('active');
  el('scriptSection').classList.remove('active');
  el('emptyState').style.display = 'block';
  el('progressWrap').classList.add('active');

  const fd = new FormData();
  fd.append('url', url);

  try {
    const r = await fetch('/api/analyze', {method:'POST', body:fd});
    const d = await r.json();
    currentTaskId = d.task_id;
    poll();
  } catch(e){
    el('shotsContainer').innerHTML = `<div style="color:#f85149;text-align:center;padding:40px">❌ 失败: ${e.message}</div>`;
    this.disabled = false;
    el('urlInput').disabled = false;
  }
};

// ── 复制文案 ──
function copyScript(){
  const text = el('narrativeContent').textContent;
  if(!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el('copyBtn');
    btn.textContent = '✅ 已复制!';
    setTimeout(() => { btn.innerHTML = '📋 复制全文'; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = el('copyBtn');
    btn.textContent = '✅ 已复制!';
    setTimeout(() => { btn.innerHTML = '📋 复制全文'; }, 2000);
  });
}
</script>
</body>
</html>
